<form>
    <label for="username">Name:</label><br>
    <input type="text" id="username" name="username"><br>
    <label for="username">Email:</label><br>
    <input type="text" id="email" name="email"><br>
    <label for="pwd">Password:</label><br>
    <input type="password" id="pwd" name="pwd"><br>
    
    <label>Gender:</label><br><br>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label><br><br>

    <label>Interests:</label><br>
    <input type="checkbox" id="programming" name="interest" value="programming">
    <label for="programming">Programming</label><br>
    <input type="checkbox" id="touring" name="interest" value="touring">
    <label for="touring">Touring</label><br>
    <input type="checkbox" id="gaming" name="interest" value="gaming">
    <label for="gaming">Gaming</label><br><br>

    <label for="country">Country:</label><br>
    <select id="country" name="country" required>
        <option value=" ">Select country</option>
        <option value="Tanzania">Tanzania</option>
        <option value="Kenya">Kenya</option>
        <option value="Dubai">Dubai</option>
    </select><br><br>
    <input type="submit" value="button"> 
</form>
